version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # TypeScript 7 はネイティブ (Go) 実装で typescript/lib/tsc を公開しないため、
      # それを require する vue-tsc (Volar) が起動できない。
      # vue-tsc が TS7 に対応するまで 6.x に留める
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
      tauri:
        patterns:
          - "@tauri-apps/*"
      xterm:
        patterns:
          - "@xterm/*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
