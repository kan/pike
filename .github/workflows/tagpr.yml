name: tagpr

# リリース PR を作り、マージされたらタグを打ってリリースを走らせる（#529）。設定は `.tagpr`、
# 手順は `release` スキル、設計の理由は `.claude/rules/build.md` の「リリース PR（tagpr）」。
#
# - main が進むたびに、bump・lockfile・CHANGELOG の見出しとリンク・クレジットを載せたリリース PR
#   （ブランチ `tagpr-from-v<前回の版>`）を作り直す（`scripts/release-prepare.mjs`）
# - リリース PR がマージされると、tagpr がタグを打ち、同じ run の `release` ジョブが
#   Release ワークフローをそのタグで起動する（`workflow_dispatch`）。**GITHUB_TOKEN で打った
#   タグでは `on.push.tags` が起動しない**ので、タグの push には頼らない
# - `workflow_dispatch` は、リリース PR にラベル（`tagpr:minor`）を付けたあとの作り直し用
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # クレジットの作り直しは依存のコード（npm の node_modules、cargo のレジストリ）を読み、
  # ネットワークにも出るので、書き込みの権限を持たないこのジョブで行い、tagpr のジョブへ
  # artifact で渡す（#562）。一覧は Pike 自身を含まないので、版を上げる前の main のツリーで
  # 作っても、リリース PR のツリーで作ったものと同じになる
  credits:
    name: Generate the credits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # キャッシュは使わない。別のワークフローが書いたキャッシュを、tagpr のジョブが
      # コミットするものに混ぜない
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      # Rust はランナーに入っている stable を使う（`cargo metadata` しか呼ばない）。
      # ライセンスの本文を読むだけなので、依存のスクリプトは走らせない
      - name: Install frontend dependencies (no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate the credits
        run: node scripts/gen-credits.mjs

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: credits
          path: src/assets/credits.json
          retention-days: 1
          if-no-files-found: error

  tagpr:
    name: Prepare the release pull request
    needs: credits
    # credits が落ちても走らせる。リリース PR のマージの run はタグを打つだけでクレジットを
    # 使わないので、ネットワークの一時的な失敗でタグを打ち損ねないようにする。リリース PR を
    # 作り直す run は、PIKE_CREDITS のファイルが無いので release-prepare.mjs が何も書き換えずに落ちる
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tagpr どうしは並べない（同じリリース PR のブランチを作り直し合う）。止めもしない
    # （タグを打った直後に止めると、成果物の無いタグが残る）。release ジョブは含めないので、
    # ビルドの最中に来た push もリリース PR の作り直しを待たされない。
    #
    # それでも GitHub は待っている run を 1 つしか持たない。リリース PR のマージの run が
    # 待っている間に push が来ると、その run は cancelled になりタグが打たれない。後の push の
    # run は `scripts/tagpr/release-prepare.mjs` の検査（タグより新しい版の節がある）で赤になるので、
    # マージコミットの run を再実行する（release スキル）
    concurrency:
      group: tagpr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # **このジョブは書き込みの権限を持つので、依存のコードを走らせない**: `npm ci` はせず、
      # `bump-version.mjs` が呼ぶのは `cargo update --workspace` と
      # `npm install --package-lock-only --ignore-scripts` だけ。scripts/tagpr/ は Node の組み込みの
      # モジュールしか使わない。Rust はランナーの stable を使う。
      # Node は CI と同じ lts/* にそろえる（package-lock.json を書く npm の版で、書き出しが変わる）。
      # キャッシュは使わない（別のワークフローが書いたキャッシュを、このジョブがコミットするものに混ぜない）
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v8.0.2
        # credits が落ちたときは artifact が無い（上の if を参照）
        continue-on-error: true
        with:
          name: credits
          path: ${{ runner.temp }}/credits

      - id: tagpr
        uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # scripts/release-prepare.mjs が src/assets/credits.json をこれで置き換える
          PIKE_CREDITS: ${{ runner.temp }}/credits/credits.json

  # **GITHUB_TOKEN で push したタグでは `push: tags` が起動しない。** `workflow_dispatch` は
  # その例外なので、タグを ref にして release.yml を起動する（#562）。`workflow_call` で同じ
  # run から呼ばないのは、run の ref が main になり、attestation の source ref もそれを名乗るため
  release:
    name: Start the release
    needs: tagpr
    # 状態の関数を書かないと暗黙の success() になり、tagpr の手前の credits が落ちただけで
    # （タグは打たれているのに）飛ばされる
    if: ${{ !cancelled() && needs.tagpr.result == 'success' && needs.tagpr.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # workflow_dispatch
    steps:
      - name: Dispatch release.yml on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
