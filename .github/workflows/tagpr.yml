name: tagpr

# リリース PR を作り、マージされたらタグを打ってリリースを走らせる（#529）。設定は `.tagpr`、
# 手順は `release` スキル、設計の理由は `.claude/rules/build.md` の「リリース PR（tagpr）」。
#
# tagpr のジョブは kan/tagpr-scripts の共通の workflow を呼ぶ（#573。`scripts/tagpr/.github/workflows/tagpr.yml`
# がその写し）。動きと落ちたときの扱いは `scripts/tagpr/README.md` の「The tagpr workflow」。
#
# - main が進むたびに、bump・lockfile・CHANGELOG の見出しとリンク・クレジットを載せたリリース PR
#   （ブランチ `tagpr-from-v<前回の版>`）を作り直す（`scripts/release-prepare.mjs`）。run が落ちると
#   リリース PR は draft になり、次に成功した run が ready に戻す
# - リリース PR がマージされると、tagpr がタグを打ち、共通の workflow がそれを annotated に打ち直してから
#   Release ワークフローをそのタグで起動する（`workflow_dispatch`）。**GITHUB_TOKEN で打った
#   タグでは `on.push.tags` が起動しない**ので、タグの push には頼らない
# - `workflow_dispatch` は、リリース PR にラベル（`tagpr:minor`）を付けたあとの作り直し用
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# **concurrency は付けない。** run を並べるのは共通の workflow の tagpr のジョブ（group は
# `tagpr-scripts-release-pr`）。同じ名前の group をここにも付けると GitHub が deadlock として止め、
# 別の名前を付けると、待っている run が置き換えられる場所が 2 つに増える
jobs:
  # クレジットの作り直しは依存のコード（npm の node_modules、cargo のレジストリ）を読み、
  # ネットワークにも出るので、書き込みの権限を持たないこのジョブで行い、tagpr のジョブへ
  # artifact で渡す（#562）。一覧は Pike 自身を含まないので、版を上げる前の main のツリーで
  # 作っても、リリース PR のツリーで作ったものと同じになる
  credits:
    name: Generate the credits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # キャッシュは使わない。別のワークフローが書いたキャッシュを、tagpr のジョブが
      # コミットするものに混ぜない
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      # Rust はランナーに入っている stable を使う（`cargo metadata` しか呼ばない）。
      # ライセンスの本文を読むだけなので、依存のスクリプトは走らせない
      - name: Install frontend dependencies (no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate the credits
        run: node scripts/gen-credits.mjs

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: credits
          path: src/assets/credits.json
          retention-days: 1
          if-no-files-found: error

  tagpr:
    needs: credits
    # credits が落ちても走らせる。リリース PR のマージの run はタグを打つだけでクレジットを
    # 使わないので、ネットワークの一時的な失敗でタグを打ち損ねないようにする。リリース PR を
    # 作り直す run は、TAGPR_ARTIFACT_DIR が空になるので release-prepare.mjs が何も書き換えずに落ちる
    if: ${{ !cancelled() }}
    # SHA は scripts/tagpr/ に取り込んだ kan/tagpr-scripts の commit（subtree の squash のコミットにある
    # `git-subtree-split`）。**subtree pull をする PR で一緒に上げる。** 別の repo の reusable workflow は
    # actions.lock が固定しないので SHA で書き、Dependabot には上げさせない（dependabot.yml の ignore）
    uses: kan/tagpr-scripts/.github/workflows/tagpr.yml@776734198ce4cade40332a9d1772ef8a2fd01c2f
    # 共通の workflow が使える上限。GitHub は run の始めに、飛ばされるジョブの権限まで検査するので、
    # 4 つとも書く
    permissions:
      contents: write       # リリース PR のブランチとタグを push する
      pull-requests: write  # リリース PR を作る・更新する、draft と ready を切り替える
      issues: read          # ラベルを読む
      actions: write        # release.yml を workflow_dispatch で起動する
    with:
      release-workflow: release.yml
      # 展開すると TAGPR_ARTIFACT_DIR の直下に credits.json ができる（scripts/release-prepare.mjs が読む）
      artifact: credits
      timeout-minutes: 20
