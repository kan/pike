name: Release

# **タグを ref にした `workflow_dispatch` で起動する**（#562）。通常はリリース PR のマージ後に、
# tagpr のワークフローがタグを打ってから `gh workflow run release.yml --ref vX.Y.Z` で起動する。
# 打ってあるタグで丸ごとやり直すとき・手でタグを打ち直したときも同じコマンドで起動する。
#
# - tagpr は GITHUB_TOKEN でタグを打つので、タグの push では起動しない（`push.tags` は置かない）。
#   `workflow_dispatch` はその例外
# - `workflow_call` で tagpr の run から呼ばない。呼ぶと run の ref が `refs/heads/main` になり、
#   attestation の source ref もそれを名乗る。dispatch ならタグが残る（v0.70.0 までは呼んでいた）
# - ワークフローの定義もタグの時点のものが使われる
#
# ジョブは権限と鍵ごとに分ける（#585。kan/tagpr-scripts#9）。**依存のコードを動かすジョブには、
# 書き込みの権限も署名の鍵も持たせない。**
#
# - draft: ドラフトを作る（contents: write）
# - build: コンパイルだけを行う（contents: read、secret なし）。依存の build.rs・proc macro・
#   npm のビルドが動くのはここだけ
# - bundle: build の成果物からインストーラを作り、署名する（contents: read、署名の鍵を持つ）。
#   動くのは tauri-cli とバンドラのツールだけ
# - attest: 来歴の証明を付ける（id-token: write / attestations: write だけ）
# - upload: ドラフトへ上げる（contents: write だけ）
# - updater-json: latest.json を組み立てて上げる（contents: write）
on:
  workflow_dispatch:
    inputs:
      dry-run:
        # build と bundle だけを走らせ、成果物を artifact に残す。ドラフト・attestation・upload は
        # 飛ばすので、ブランチで起動して release.yml の変更を確かめられる
        description: build と bundle だけを走らせる（ブランチで確かめるとき）
        type: boolean
        default: false

permissions:
  contents: read

# 同じタグの実行を並べない（tagpr からの起動と手での再実行が重なると、draft ジョブが互いの
# ドラフトを消し合う）。止めもしない（ビルドの途中で止めると、成果物の欠けたドラフトが残る）
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# タグは起動した ref から取る。ブランチで起動したら draft ジョブが止める
env:
  TAG: ${{ github.ref_name }}

jobs:
  # ドラフトは先に 1 つだけ作る（#505。並列のジョブにタグから探させると 2 つ作りうる）。
  # アセットは upload が 1 回で上げ、ID は updater-json が使う。ジョブの分け方の理由は
  # `.claude/rules/build.md`。
  draft:
    name: Create the draft release
    # dry-run ではドラフトを作らない。**タグの検査は dry-run でない起動にはそのまま効く**
    # （build はこのジョブが成功したときか、dry-run のときにしか走らない）
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      # ブランチで起動すると TAG がブランチ名になる。checkout は ref を指定しない
      # （起動したタグのコミットを取る）
      - name: Check that the run is on a tag
        if: github.ref_type != 'tag'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "release.yml はタグで起動する（gh workflow run release.yml --ref vX.Y.Z）。起動した ref: $REF" >&2
          exit 1

      - uses: actions/checkout@v7.0.1

      - name: Create the draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 成果物の名前は tauri.conf.json の version から付くので、タグと食い違えば止める。
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # updater-json.mjs と同じ形だけを通す（プレリリースのタグはビルドの前に止める）。
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "v$version" != "$TAG" ]; then
            echo "tag $TAG must be vX.Y.Z and match the version in tauri.conf.json ($version)" >&2
            exit 1
          fi
          # 本文は CHANGELOG の節から作る。latest.json の notes にもなる（updater-json.mjs が写す）。
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release-notes.mjs "$version" > "$notes"
          # 同じタグのドラフトが残っていたら（再実行やタグの打ち直し）消してから作り直す。
          # ドラフトを常に 1 つにしておくと、タグ名で上げる upload と updater-json が
          # 同じドラフトに当たり、前の実行の latest.json やアセットも残らない。
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          while read -r old_id is_draft; do
            [ -n "$old_id" ] || continue
            if [ "$is_draft" != true ]; then
              echo "release $TAG is already published" >&2
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$old_id"
          done <<< "$releases"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Pike v$version" --notes-file "$notes"
          id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # **コンパイルだけを行う。書き込みの権限も secret も持たない**（#585）。依存のコード（npm の
  # ビルド、cargo の build.rs と proc macro）が動くのはこのジョブだけ。
  build:
    name: Build (${{ matrix.name }})
    needs: draft
    # dry-run でない起動は、draft のタグの検査を通ったときだけ走る（タグでない ref では止まる）。
    # draft は dry-run で飛ばされるので、状態の関数を書く（暗黙の success() だと dry-run で走らない）
    if: ${{ !cancelled() && (inputs.dry-run || needs.draft.result == 'success') }}
    permissions:
      contents: read
    # bundle も同じ表を使う（アンカー）。artifact の名前は `runner.os`（Windows / macOS）で付ける
    strategy: &platforms
      # 2 つの OS を並列に走らせる（#505）。どちらかが落ちれば upload は走らないので、
      # もう片方を止めず、落ちたジョブだけを再実行できるようにしておく。
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # macos-latest は Apple Silicon なので、ホストのトリプルがそのまま
          # aarch64-apple-darwin になる（クロスビルドの指定は要らない）。
          - name: macOS (arm64)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # rust-cache は置かない（#505）。Actions のキャッシュは保存した ref とデフォルト
      # ブランチからしか読めず、リリースは毎回新しいタグで走るので、保存の時間だけがかかる。

      - uses: extractions/setup-just@v4.0.0

      - name: Download rg sidecar
        run: just fetch-rg

      # lockfile のとおりに入れる（`npm install` と違って lockfile を書き換えない）
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # バンドルは bundle のジョブで行う。`beforeBuildCommand`（`npm run build`）はここで走る
      - name: Compile
        run: npx tauri build --no-bundle

      # ポータブル版（#451）。インストーラと同じ `pike.exe` と `rg.exe` に目印のファイルを
      # 添えた zip。**`latest.json` には載せない**（ポータブル版は自分を更新しない）。
      - name: Package the portable zip
        if: runner.os == 'Windows'
        shell: bash
        run: just package-portable

      # bundle のジョブが要るものだけを渡す。upload-artifact は実行ビットを落とすので tar にする
      # （macOS の `pike` と sidecar の `rg`）。sidecar はバンドラが `binaries/` から取る。
      # **バンドラは crate の bin をすべて同梱する**（`src/bin/` の検証バイナリも。今までのリリースも
      # そうなっている）ので、`pike` だけでなく全部を渡す。tar のファイルは作業ディレクトリに相対で
      # 置く（Windows の GNU tar は `D:\...` の `:` を別のホストの指定と読む）
      - name: Pack the build output
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          files=(src-tauri/binaries)
          if [ "$RUNNER_OS" = Windows ]; then
            ext=.exe
            files+=(artifacts/portable)
          fi
          for bin in pike src-tauri/src/bin/*.rs; do
            files+=("src-tauri/target/release/$(basename "$bin" .rs)$ext")
          done
          tar -cf build.tar "${files[@]}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ runner.os }}
          path: build.tar
          retention-days: 3
          if-no-files-found: error

  # **インストーラを作って署名する。署名の鍵を持つが、依存のコードは動かさない**（#585）。
  # 動くのは tauri-cli（`tauri bundle`）と、バンドラが使うツール（NSIS・WiX・Apple の codesign /
  # notarytool / hdiutil）だけ。updater の署名（`.sig`）と Apple の署名・公証はバンドラの流れに
  # 入っていて外へ出せないので、鍵はここに置く（理由は `.claude/rules/build.md`）。
  # setup-node のキャッシュと、ツールチェーンを入れる action は使わない
  bundle:
    name: Bundle & sign (${{ matrix.name }})
    needs: build
    # dry-run では上流の draft が skipped なので、暗黙の success() だと飛ばされる
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
    strategy: *platforms
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-${{ runner.os }}

      - name: Unpack the build output
        shell: bash
        run: tar -xf build.tar && rm build.tar

      # `tauri bundle` は cargo で target のディレクトリを調べる。ツールチェーンを入れる action は
      # このジョブでは使わず、ランナーに入っている rustup で build と同じ stable にそろえる
      - name: Set up the Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # tauri-cli を入れるため。install scripts は走らせない（このジョブで動く依存のコードは tauri-cli だけ）
      - name: Install the Tauri CLI (no scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # notarytool は鍵をファイルで受け取るので、secret から書き出してパスを渡す。
      # tauri のバンドラも同じ 3 つ（issuer / key id / key path）で公証する。
      - name: Prepare the notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.private_keys
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey.p8
          chmod 600 ~/.private_keys/AuthKey.p8
          echo "APPLE_API_KEY_PATH=$HOME/.private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # build のジョブがコンパイルしたバイナリから作る（`build.beforeBundleCommand` は置いていない）。
      # 証明書はバンドラが一時的なキーチェーンに読み込む
      - name: Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # macOS の署名と公証（#283）。Windows のジョブでは読まれない。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npx tauri bundle

      # **tauri が公証するのは `.app` だけ**（そのあと staple して、その `.app` から
      # `.dmg` を作る）。`.dmg` 自身は署名されるが公証には出されないので、
      # ダウンロードした利用者の Gatekeeper が配布物を弾く（`spctl` が
      # `rejected / source=Unnotarized Developer ID` を返す。実機で確認）。ここで公証して staple する。
      - name: Notarize and staple the .dmg
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          # 配列で受けて 1 件であることを確かめる。素の `ls` だと、複数一致した
          # ときに 2 語の文字列になって "$dmg" が存在しないパスとして渡る。
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "expected exactly one .dmg, found ${#dmgs[@]}: ${dmgs[*]-}" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          # 弾かれたら失敗させる（set -e）。ここを通れば配布物として問題ない。
          spctl -a -vvv -t open --context context:primary-signature "$dmg"

      # **リリースに上げる名前でそろえる。** 名前は `scripts/release-assets.mjs` の表が持ち、
      # 1 つずつ名指しして写し、欠けていれば止める（`bundle/` には配布しない `.msi.zip` なども
      # 並ぶので、グロブで集めない）。リポジトリのスクリプトで、依存のコードは動かない
      - name: Collect the release assets
        run: node scripts/release-assets.mjs collect "${{ runner.os }}" release-assets

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ runner.os }}
          path: release-assets/
          retention-days: 3
          if-no-files-found: error

  # **来歴の証明だけを行う**（#468 / #585）。`id-token: write` と `attestations: write` を持つのは
  # このジョブだけ。署名は Actions の OIDC トークンで Sigstore の短命証明書を取って行うので、
  # 鍵の secret は要らない。
  attest:
    name: Attest the artifacts
    needs: bundle
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # 表（`scripts/release-assets.mjs`）を読むためだけに取る。依存は入れない
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # 利用者が手でダウンロードするファイルだけを対象にする（表の `attest`）。`.sig` と `latest.json` は
      # 付けない（updater の経路は minisign の検証で足りる）。`.dmg` は staple のあとのもの
      # （staple はダイジェストを変えるので、配布するファイルそのものに付ける。`.claude/rules/build.md`）。
      # 表と artifact がそろっていることを先に確かめる（欠けたファイルを黙って飛ばさない）
      - name: List the subjects
        id: subjects
        run: |
          set -euo pipefail
          node scripts/release-assets.mjs check release
          {
            echo 'paths<<EOF'
            node scripts/release-assets.mjs attest release
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

  # **ドラフトへ上げるだけ。依存のコードは動かさない**（#585）。contents: write を持つ
  upload:
    name: Upload to the draft
    needs: [draft, bundle]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 表（`scripts/release-assets.mjs`）を読むためだけに取る。依存は入れない
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # 表のアセットがちょうどそろっていなければ上げない
      - name: Upload the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-assets.mjs check release
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

  # 両 OS の成果物がそろったドラフトから latest.json を組み立て、署名を検証して 1 回だけ上げる（#505）。
  # **attest も待つ。** 証明が落ちたまま latest.json がそろうと、仕上がったドラフトに見える
  # （Immutable releases なので、公開してから証明は足せない）
  updater-json:
    name: Upload latest.json
    needs: [draft, upload, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Node はランナーに入っているもので足りる（組み込みのモジュールしか使わない）。
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          set -euo pipefail
          node scripts/updater-json.mjs "$RELEASE_ID" latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
