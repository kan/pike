name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ドラフトは先に 1 つだけ作り、両 OS のビルドにその ID を渡す（#505。並列の 2 ジョブに
  # タグから探させると 2 つ作りうる）。3 段の構成の理由は `.claude/rules/build.md`。
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create the draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 成果物の名前は tauri.conf.json の version から付くので、タグと食い違えば止める。
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # updater-json.mjs と同じ形だけを通す（プレリリースのタグはビルドの前に止める）。
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "v$version" != "$TAG" ]; then
            echo "tag $TAG must be vX.Y.Z and match the version in tauri.conf.json ($version)" >&2
            exit 1
          fi
          # 本文は CHANGELOG の節から作る。latest.json の notes にもなる（updater-json.mjs が写す）。
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release-notes.mjs "$version" > "$notes"
          # 同じタグのドラフトが残っていたら（再実行やタグの打ち直し）消してから作り直す。
          # ドラフトを常に 1 つにしておくと、タグ名で上げる段と releaseId で上げる段が
          # 同じドラフトに当たり、前の実行の latest.json やアセットも残らない。
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          while read -r old_id is_draft; do
            [ -n "$old_id" ] || continue
            if [ "$is_draft" != true ]; then
              echo "release $TAG is already published" >&2
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$old_id"
          done <<< "$releases"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Pike v$version" --notes-file "$notes"
          id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Release (${{ matrix.name }})
    needs: draft
    permissions:
      contents: write
      # Artifact attestations（#468）。署名は Actions の OIDC トークンで Sigstore の
      # 短命証明書を取って行うので、鍵の secret は増えない。
      id-token: write
      attestations: write
    strategy:
      # 2 つの OS を並列に走らせる（#505）。どちらかが落ちれば updater-json は走らないので、
      # もう片方を止めず、落ちたジョブだけを再実行できるようにしておく。
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # macos-latest は Apple Silicon なので、ホストのトリプルがそのまま
          # aarch64-apple-darwin になる（クロスビルドの指定は要らない）。
          - name: macOS (arm64)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # rust-cache は置かない（#505）。Actions のキャッシュは保存した ref とデフォルト
      # ブランチからしか読めず、リリースは毎回新しいタグで走るので、保存の時間だけがかかる。

      - uses: extractions/setup-just@v4.0.0

      - name: Download rg sidecar
        run: just fetch-rg

      - name: Install frontend dependencies
        run: npm install

      # notarytool は鍵をファイルで受け取るので、secret から書き出してパスを渡す。
      # tauri のバンドラも同じ 3 つ（issuer / key id / key path）で公証する。
      - name: Prepare the notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.private_keys
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey.p8
          chmod 600 ~/.private_keys/AuthKey.p8
          echo "APPLE_API_KEY_PATH=$HOME/.private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # macOS の署名と公証（#283）。Windows のジョブでは読まれない。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          # latest.json は updater-json のジョブが組み立てる。`.sig` はここで上げる（既定）。
          uploadUpdaterJson: false

      # ポータブル版（#451）。インストーラと同じ `pike.exe` に目印のファイルを添えた zip を、
      # tauri-action が作ったドラフトへ足す。**`latest.json` には載せない**（ポータブル版は
      # 自分を更新しない）ので、updater の経路には影響しない。
      - name: Package and upload the portable zip
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          just package-portable
          # スクリプトは出力先を空にしてから作るので、ここにあるのは今回の 1 件だけ。
          shopt -s nullglob
          zips=(artifacts/portable/*-portable.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "expected exactly one portable zip, found ${#zips[@]}: ${zips[*]-}" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${zips[0]}" --clobber --repo "$GITHUB_REPOSITORY"

      # 来歴の証明（#468）。利用者が手でダウンロードするファイルだけを対象にする。
      # `.sig` と `latest.json` は付けない（updater の経路は minisign の検証で足りる）。
      # グロブは `.msi.zip` や `.sig` を拾わない形にしてある。理由は `.claude/rules/build.md`。
      - name: Attest the Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            artifacts/portable/*-portable.zip

      # **tauri が公証するのは `.app` だけ**（そのあと staple して、その `.app` から
      # `.dmg` を作る）。`.dmg` 自身は署名されるが公証には出されないので、
      # ダウンロードした利用者の Gatekeeper が配布物を弾く（`spctl` が
      # `rejected / source=Unnotarized Developer ID` を返す。実機で確認）。
      # ここで公証して staple し、tauri-action が上げた `.dmg` を差し替える。
      - name: Notarize and staple the .dmg
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 配列で受けて 1 件であることを確かめる。素の `ls` だと、複数一致した
          # ときに 2 語の文字列になって "$dmg" が存在しないパスとして渡る。
          # tauri-action の artifactPaths 出力を使う手もあるが、こちらの
          # レイアウトは macOS 実機で確認済みなのでグロブのままにしてある。
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "expected exactly one .dmg, found ${#dmgs[@]}: ${dmgs[*]-}" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          # 弾かれたら失敗させる（set -e）。ここを通れば配布物として問題ない。
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          gh release upload "${{ github.ref_name }}" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"

      # **必ず staple のあとに置く**（#468）。staple は `.dmg` にチケットを書き足すので
      # ダイジェストが変わる。前に置くと、差し替え前のファイルを証明することになり、
      # 利用者が落とした `.dmg` の検証が通らない。
      # `.app.tar.gz` は手元では `Pike.app.tar.gz` で、リリース上の名前
      # （`Pike_X.Y.Z_aarch64.app.tar.gz`）は tauri-action が付ける。検証はダイジェストで
      # 行うので、名前が違っても通る。
      - name: Attest the macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

  # 両 OS の成果物がそろったドラフトから latest.json を組み立て、署名を検証して 1 回だけ上げる（#505）。
  updater-json:
    name: Upload latest.json
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      # Node はランナーに入っているもので足りる（組み込みのモジュールしか使わない）。
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/updater-json.mjs "$RELEASE_ID" latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
