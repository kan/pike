name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 画像だけの PR（Screenshots ワークフローが作る）では run を作らない。ボットが作った PR の
    # run は承認待ちで止まり、承認せずにマージすると failure で残る（.claude/rules/build.md）
    paths-ignore:
      - "docs/manual/img/**"

permissions:
  contents: read

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    # macOS も回す。`appmenu`・`types::os_open` の腕・`pty` の Unix 側は `cfg` に阻まれて
    # Windows のジョブから 1 行も見えないので、これが無いと**タグを打つまで壊れている
    # ことに気付けない**（v0.43.0 のリリースで実際に 2 回落ちた）。
    #
    # 素の lint・ドキュメント整合・型検査は OS に依らないので Windows 側だけが持つ。
    # macOS で要るのは `dist/`（`generate_context!` が読む）だけなので `vite build` に絞る。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          # OS ごとに分ける（分けないと 2 ジョブが同じキャッシュを取り合う）
          key: ${{ matrix.os }}

      # 各ステップの中身は justfile を正本にする（ローカルと同じコマンドが走る）
      - uses: extractions/setup-just@v4.0.0

      - name: Download rg sidecar
        run: just fetch-rg

      - name: Install frontend dependencies
        run: npm install

      - name: Biome lint & format check
        if: runner.os == 'Windows'
        run: just lint

      # Rust: rustfmt。整形は cfg に依らないので Windows 側だけで足りる（#313）
      - name: Cargo fmt check
        if: runner.os == 'Windows'
        run: just fmt-check

      # Docs: .claude/structure.md の構成・開発ノートの参照パス、マニュアルの画像とリンク
      - name: Docs consistency check
        if: runner.os == 'Windows'
        run: just check-docs

      # Docs: マニュアルの「プリセット別の早見表」と実装の割り当て表の照合（#280）。
      # 実装を import して 4 通り（プリセット × プラットフォーム）を作るので、
      # Windows の runner でも macOS 側のずれを検出できる。
      - name: Shortcut table check
        if: runner.os == 'Windows'
        run: just check-shortcuts

      # クレジット（src/assets/credits.json）と lockfile の依存の照合（#420）。
      # `cargo metadata --filter-platform` で両 OS のぶんを見るので Windows だけでよい。
      # **dependabot の PR では落としても job を失敗にしない。** 一覧は版まで持つので、配布物に
      # 入る依存の更新は patch でも必ず食い違い、dependabot は作り直せない。取り込むときに
      # `just credits` で作り直し、main への push ではこのステップが今までどおり落とす。
      # 判定は PR の作者で見る（`github.actor` は `@dependabot rebase` を頼んだ人に変わりうる）。
      - name: Credits check
        if: runner.os == 'Windows'
        continue-on-error: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: just check-credits

      # Frontend: 純粋なロジックのテスト（tests/*.test.ts、#403）。OS に依らない。
      - name: TypeScript unit tests
        if: runner.os == 'Windows'
        run: just test-ts

      # Frontend: TypeScript type check + Vite build
      - name: Vue/TypeScript check & build
        if: runner.os == 'Windows'
        run: just build-web

      # clippy は `generate_context!` 経由で `dist/` を読むので、Rust を検査するにも
      # フロントの成果物が要る。型検査は上の Windows 側が済ませている。
      - name: Build frontend assets
        if: runner.os != 'Windows'
        run: just build-web-dist

      - name: Cargo clippy
        run: just clippy

      # Rust: unit tests
      - name: Cargo test
        run: just test
