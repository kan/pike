name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check & Test
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      # 各ステップの中身は justfile を正本にする（ローカルと同じコマンドが走る）
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Download rg sidecar
        run: just fetch-rg

      - name: Install frontend dependencies
        run: npm install

      - name: Biome lint & format check
        run: just lint

      # Docs: CLAUDE.md のディレクトリ構成・参照パス、マニュアルの画像とリンク
      - name: Docs consistency check
        run: just check-docs

      # Frontend: TypeScript type check + Vite build
      - name: Vue/TypeScript check & build
        run: just build-web

      - name: Cargo clippy
        run: just clippy

      # Rust: unit tests
      - name: Cargo test
        run: just test
