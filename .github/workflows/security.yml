name: Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday 9:00 UTC

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: extractions/setup-just@v4.0.0
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: just audit-cargo

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - uses: extractions/setup-just@v4.0.0
      - run: npm install
      - run: just audit-npm
