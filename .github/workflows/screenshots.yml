name: Screenshots

# マニュアルとヒーローのスクリーンショットを Windows ランナーで撮る試作（#506）。
#
# 手元の撮影機（日本語の Windows・拡大率 150%）と同じ絵にするため、撮影機の側で決まる前提
# （`e2e/support/prepare.ts` の `CAPTURE_ENV`）をここで揃える:
#
# - 表示倍率 1.5 … ランナーの画面は 100% 固定。撮影用ビルドが WebView2 に
#   `--force-device-scale-factor=1.5` を渡す（`tauri.e2e.conf.json`。環境変数
#   `WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS` では効かなかった）
# - UI のフォント … ランナーは英語版の Windows で `system-ui` が Segoe UI になる。撮影用ビルドは
#   Yu Gothic UI を名指しする（`lib/fontDetection.ts` の `SYSTEM_UI_FONT`）ので、ここでは
#   フォント本体を日本語フォントの追加機能で入れる
# - 等幅フォント … PlemolJP Console NF をリリースの zip から入れる
# - タイムゾーン … 相対日時（「昨日」）は日付の境目で変わるので日本時間に揃える
#
# 撮った画像はアーティファクトに上げるだけで、コミットはしない。
on:
  workflow_dispatch:
    inputs:
      any_env:
        description: 撮影環境の前提が外れても警告だけで撮る（PIKE_E2E_ANY_ENV=1）
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  capture:
    name: Capture screenshots
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          # CI の check と分ける（あちらは e2e feature を入れずにビルドする）
          key: e2e

      - uses: extractions/setup-just@v4.0.0

      - name: Set time zone to JST
        run: tzutil /s "Tokyo Standard Time"

      # Yu Gothic UI は日本語の補助フォント（追加機能）に入っている（Yu Gothic / Meiryo / BIZ UD も
      # 入る）。追加機能は Windows Update から落とすので 13 分ほどかかる。**入ったフォントの
      # ファイルをキャッシュに置き**、2 回目からはそこから入れる
      - name: Restore Japanese fonts
        id: jpan-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/jpan-fonts
          key: jpan-fonts-windows-v1

      - name: Install Japanese fonts (from cache)
        if: steps.jpan-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          pwsh scripts/install-fonts.ps1 "$env:RUNNER_TEMP/jpan-fonts"
          if (-not (Test-Path "$env:WINDIR\Fonts\YuGothR.ttc")) { throw 'キャッシュに YuGothR.ttc（Yu Gothic UI）が無い。キーの版を上げて取り直す' }

      # 入る前と後の %WINDIR%\Fonts を比べて、増えたファイルをキャッシュへ写す
      - name: Install Japanese fonts (Windows Update)
        if: steps.jpan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $fontsDir = "$env:WINDIR\Fonts"
          $before = Get-ChildItem $fontsDir -File | Select-Object -ExpandProperty Name
          $r = Add-WindowsCapability -Online -Name 'Language.Fonts.Jpan~~~und-JPAN~0.0.1.0'
          $r | Format-List Online, RestartNeeded
          $cap = Get-WindowsCapability -Online -Name 'Language.Fonts.Jpan*'
          $cap | Format-List Name, State
          if ($cap.State -ne 'Installed') { throw "Language.Fonts.Jpan が入っていない（$($cap.State)）" }
          $added = Get-ChildItem $fontsDir -File | Where-Object { $before -notcontains $_.Name }
          $cache = Join-Path $env:RUNNER_TEMP 'jpan-fonts'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $added | Copy-Item -Destination $cache
          $added | Select-Object -ExpandProperty Name
          if (-not (Test-Path (Join-Path $cache 'YuGothR.ttc'))) { throw 'YuGothR.ttc（Yu Gothic UI）が増えていない' }

      - name: Save Japanese fonts
        if: steps.jpan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/jpan-fonts
          key: jpan-fonts-windows-v1

      - name: Install PlemolJP Console NF
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLEMOLJP_VERSION: v3.1.0
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'plemoljp'
          New-Item -ItemType Directory -Force $work | Out-Null
          gh release download $env:PLEMOLJP_VERSION -R yuru7/PlemolJP -p "PlemolJP_NF_$($env:PLEMOLJP_VERSION).zip" -D $work
          Expand-Archive -Path (Join-Path $work "PlemolJP_NF_$($env:PLEMOLJP_VERSION).zip") -DestinationPath $work
          $dir = Get-ChildItem -Path $work -Recurse -Directory -Filter 'PlemolJPConsole_NF' | Select-Object -First 1
          if (-not $dir) { throw 'PlemolJPConsole_NF が zip に無い' }
          pwsh scripts/install-fonts.ps1 $dir.FullName

      # 撮影の前提が外れたときに原因を追えるよう、画面とフォントの状態を残す
      - name: Show capture environment
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, Primary
          tzutil /g
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts' |
            Get-Member -MemberType NoteProperty |
            Where-Object Name -Match 'Yu Gothic|PlemolJP' |
            Select-Object -ExpandProperty Name

      - name: Download rg sidecar
        run: just fetch-rg

      - name: Install frontend dependencies
        run: npm install

      - name: Build capture binary
        run: just e2e-build

      - name: Capture
        env:
          PIKE_E2E_ANY_ENV: ${{ inputs.any_env && '1' || '' }}
        run: just e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
