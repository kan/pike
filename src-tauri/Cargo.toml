[package]
name = "pike"
version = "0.61.1"
description = "Lightweight AI-coding-focused development environment"
authors = ["Kan Fushihara <kan.fushihara@gmail.com>"]
license = "MIT"
repository = "https://github.com/kan/pike"
edition = "2024"
# 依存の中でいちばん新しい要求（tauri 2.12 系列とそのプラグインが 1.90）に合わせる。
# ここを下回る値を書いても、cargo は依存の `rust-version` で先に落とすので意味を持たない。
# **tauri を上げたら見直す**（dependabot は依存の版だけを上げ、ここは動かさない。#458）。
#
# **依存の解決にも効く。** edition 2024 の既定のリゾルバ（3）は、`cargo update` のときに
# ここより新しい Rust を要求する版を避ける。上げ忘れると依存が黙って古い版に留まる。
# README の「前提」にも同じ値がある。
rust-version = "1.90"
default-run = "pike"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 文字列まわりの無駄を再発させないための追加 lint（#382）。`just clippy` は
# `-D warnings` なので、ここに並べたものは CI が落とす。
#
# **常時は当てない 3 つがある。** 棚卸しのときだけ `just clippy-deep` で足して見る
# （コピペ用のコマンドをここに書かない。入口は justfile、という #231 の規約に従う）。
#
# - `redundant_clone` / `needless_collect` … nursery。誤検出があり（#382 の時点で
#   `pty/busy.rs` の並列化のための `collect` が実際に誤検出された）、しかも
#   toolchain を上げた日に増えうる
# - `assigning_clones` … 得があるのは**繰り返し代入する変数**だけ（`agent_usage/
#   opencode.rs` が `clone_from` を使っているのがそれ）。1 回しか通らない代入にも
#   当たるので、そこでは `x = y.to_owned()` を `y.clone_into(&mut x)` に変えて
#   読みにくくするだけになる（#382 の時点で 4 件がそれ）
[lints.clippy]
# `&str` に `to_string()` を呼ばない。生成コードは `to_owned()` と同一で速さは
# 変わらないが、綴りが混ざると「どちらが安いのか」を毎回考えることになる
str_to_string = "warn"
# `&&T`（T: Display）の `to_string()`。`Display` の blanket impl を通るので、
# memcpy 1 回では済まず `fmt::Formatter` を回る。**`str` は例外**で、std が
# `&str` から `&&&&&&&&&&&&str` まで特殊化してあるため速さは変わらない
# （それでも参照を 1 段外すほうが読み手に優しいので当てたままにする）
inefficient_to_string = "warn"
# 所有している値への `to_vec()` / `to_owned()`
implicit_clone = "warn"
# `s.push_str(&format!(…))`（`write!` なら中間の String を作らない）
format_push_string = "warn"
# `replace("'", …)` のような 1 文字の文字列パターン
single_char_pattern = "warn"

[features]
# E2E スクリーンショット自動化 (issue #142)。既定 OFF。`tauri build --features e2e`
# のときだけ wdio WebDriver プラグインと dynamic-acl を有効化する。cfg(debug_assertions)
# の target 依存はプロファイルを追従せず release にも混入するため、feature で制御する。
e2e = ["dep:tauri-plugin-wdio-webdriver", "tauri/dynamic-acl"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `preserve_order`: 読んだ JSON のキー順を保つ。利用者の `settings.json` へ hook を
# 足す（#299）ときに、触っていないキーまで並び替えて返さないため。
#
# **クレート全体に効く。** タスク検出（`tasks.rs`）が `package.json` / `deno.json` の
# object を `iter()` で回すので、npm scripts と deno tasks の並びもアルファベット順から
# 記載順へ変わる（意図した変更。`.claude/rules/editor.md`）。また `Map::remove` が
# `swap_remove` になるので、順を保ちたい削除は `shift_remove` を使うこと。
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` はブラウザのタブ（#368）の子 webview（`Window::add_child`）に要る。
tauri = { version = "2.12", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
bollard = "0.21"
futures-util = "0.3"
base64 = "0.23.0"
encoding_rs = "0.8.35"
# compose ファイルの解析（`docker/mod.rs`）。本家の `serde_yaml` は 0.9.34 で保守を終えた
# （版の名前が `0.9.34+deprecated`）ので、API が同じ fork を使う（#458）。
serde_yaml_ng = "0.10"
toml = "1.0"
tauri-plugin-window-state = "2.4.1"
font-kit = "0.14.3"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
notify = "8"
percent-encoding = "2"
tauri-plugin-notification = "2"
# Markdown プレビューの外部画像取得 (#239)。CSP を広げずに済ませるため、承認済み
# ホストの画像だけ Rust 側で取ってきて data: URL にする。reqwest は
# tauri-plugin-updater が既に引き込んでいるので新規のコンパイルは増えない。
# TLS プロバイダは updater と同じ ring を明示的に入れる (rustls-no-provider)。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# E2E 撮影 (issue #142)。`e2e` feature でのみ有効。本番ビルドには含まれない。
#
# **下限は 1.5。** 1.4.0 は tauri 2.12 でコンパイルできない（webview2-com 0.38 を前提にして
# いて、tauri が渡す 0.39 の型と食い違う。上流の webdriverio/desktop-mobile#684）。
# 通常のビルドはこの依存を引かないので、壊れても気付けるのは `just e2e-build` だけ
# （CI は撮影用のビルドを回さない）。
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

# プロセス生存確認（`claude_usage::is_process_alive`）に `kill(pid, 0)` が要る。
# Windows の `OpenProcess` に相当するものが std に無いため、非 Windows でだけ足す。
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

# 子 webview の位置合わせでタイトルバーの高さを NSWindow から読む（#430、
# browser.rs の `title_bar_inset`）。wry と tao が同版を使っており、新規の依存ツリー追加ではない。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    # 背景透過 (#162): 不透明モードで per-pixel alpha を切る DwmEnableBlurBehindWindow と
    # そのブラー領域 (CreateRectRgn / DeleteObject)
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # cmd やダイアログの出力を読むためのコンソールの文字コード（GetOEMCP）
    "Win32_Globalization",
    "Win32_System_Com",
    # jumplist: PROPVARIANT の手組み (VT_LPWSTR) と Variant 定数
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    # pty::busy: シェルの子プロセス有無を調べるプロセススナップショット (#178)
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    # jumplist: IObjectArray/IObjectCollection・AppendCategory/AddUserTasks は
    # Common、PKEY 用 IPropertyStore は PropertiesSystem
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    # toast (#334): 通知の活性化をプロトコルに一本化するため、XML を自前で組んで
    # ToastNotification を出す（`launch` / `activationType` を書く口が
    # tauri-winrt-notification に無い）。URI スキームの登録は Registry。
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_System_Registry",
] }
# drop_paths.rs の WebMessageReceived ブリッジ用。wry が同版を使っており
# 新規の依存ツリー追加ではない（Cargo.lock に既存）。**wry が上げたら 2 つとも合わせる**
# （tauri 2.12 / wry 0.57 で 0.38 → 0.39、windows-core 0.61 → 0.62）。合わせないと
# wry が返す COM 型と別インスタンスになる。Interface trait / PWSTR は、本体の windows と
# 版がずれても通るように、こちらの windows-core を使う。
webview2-com = "0.39"
windows-core = "0.62"
# デスクトップ通知（#318）で使っていた `tauri-winrt-notification` は #334 で外した。
# `launch` / `activationType` を書く口が無く、通知センターからのクリックを受けられない
# （`toast/mod.rs` の doc）。今は `windows` crate の ToastNotification を直に叩く。
# 背景透過（issue #162）: アクリル / Mica のすりガラス効果を実行時に適用/解除する。
window-vibrancy = "0.8"
# window-vibrancy の API が要求するハンドルの trait。`Window` と `WebviewWindow` の
# どちらでも受けられるようにするためだけに直接依存へ足してある（依存グラフには
# tauri 経由で既に入っているので、ビルドは増えない）。windows-core と同じ事情。
raw-window-handle = "0.6"

# 依存クレートのデバッグ情報を落とす。**自分のコードのぶんは残る**ので、デバッガでの
# ステップ実行も変数の確認もそのままできる。失うのは依存の中（tauri / wry など）で
# panic したときのバックトレースの行番号だけで、関数名は残る。
#
# **リンク時間の 6〜7 割がデバッグ情報の生成**で、ここが開発の内側ループの主なコスト。
# 実測（Windows・debug・増分リビルド）は `.claude/rules/build.md` の「リンク時間」を参照。
[profile.dev.package."*"]
debug = false

# `[profile.release]` は書かない（cargo の既定のまま）。LTO を試して採らなかった経緯と
# 実測は `.claude/rules/build.md` の「リリースプロファイル」を参照（#458）。

# `[[bin]]` は書かない。`src/main.rs`（= `pike`）と `src/bin/*.rs`（検証バイナリ）は cargo が
# 自動で拾う。以前は 3 つだけ並べてあり、後から足した `verify_busy` / `verify_toast` が
# 載っていなかった（#458）。バイナリが複数あるので `default-run` は要る。
