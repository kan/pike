# Rust の整形設定（#313）。`just fmt` / `just fmt-check` と CI がこれを読む。
#
# max_width は rustfmt の既定と同じ 100 で、biome（`biome.json` の lineWidth: 120）とは
# 揃えていない。揃えれば「このリポジトリの折り返しは 120」と 1 つ覚えれば済むが、Rust の
# 慣習から外れるうえ、導入時の整形差分もむしろ増えた（100 で 229 箇所、120 で 251 箇所）。
# 値を書いてあるのは既定に頼らないためで、変えるときは全体を整形し直すコミットが要る。
#
# `src-tauri/src/bin/` の検証バイナリも対象。除外に使う `ignore` は nightly 限定なので、
# stable の rustfmt では警告を出して無視される（＝実質選べない）。
max_width = 100

# `edition` は構文の解釈、`style_edition` は整形の規則（import の並べ方など）を決める。
# `cargo fmt` は Cargo.toml の edition から両方を補うが、**どちらも明示する**: `rustfmt <file>`
# を直に呼ぶと edition 2015 として読まれ、let chain で構文エラーになる（#458）。
# `style_edition` を変えるときも、全体を整形し直すコミットが要る。
edition = "2024"
style_edition = "2021"
