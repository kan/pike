<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Pike</title>
  <!--
    Pike のアプリアイコン (#256)。ラスタは全部これから作る:
    `bash scripts/make-icons.sh`

    配色は従来のアイコンから変えていない。背景はダークテーマの背景色 (bg-primary)
    で、`theme.css` の #1E1E1E、Rust 側の DARK_SURFACE_RGB とも揃う。

    角丸の半径はキャンバスの 20%。macOS の余白 (本体 80.5%) はここでは付けない。
    Windows のタスクバーは端まで描くアイコンが普通で、余白を足すのは icns だけ。
    詳細は `.claude/rules/platform.md` の「アプリアイコン」を参照。

    穂先は 3 面の錐体。輪郭は頂点・左下・右の 3 点で、そこへ稜線が 1 本入る。
    輪郭は 底辺/斜辺 = 0.89 (従来は 0.46) で正三角形に寄せてある。稜線は底辺から
    離して底面に高さを持たせてあり、底面の 高さ/幅 は 0.24 (従来 0.26)。輪郭を
    太らせると底面は横に伸びて潰れるので、太さを変えるときは稜線も一緒に見ること。

    位置は三角形の重心をキャンバス中央に合わせている。外接矩形で合わせると、
    頂点が上左に寄るぶん見た目が左下へずれる。大きさは外接矩形の長辺を
    キャンバスの約 61% に収めたもの。
  -->
  <rect width="1024" height="1024" rx="205" ry="205" fill="#1E1E1E"/>
  <g shape-rendering="geometricPrecision">
    <!-- 左の面 (陰) -->
    <polygon points="371.6,168.1 327.1,788.1 533.1,563.6" fill="#7A7A7A"/>
    <!-- 右の面 (光が当たる面) -->
    <polygon points="371.6,168.1 533.1,563.6 837.2,579.9" fill="#D4D4D4"/>
    <!-- 底面 -->
    <polygon points="327.1,788.1 533.1,563.6 837.2,579.9" fill="#444444"/>
  </g>
</svg>
